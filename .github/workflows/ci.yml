name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Every check lives in Tools/Invoke-RepositoryCheck.ps1, which also pins the
# module versions CI installs, so running that script locally is running this
# workflow. Each step runs one check, so the log names the one that failed, and
# each runs even after an earlier one fails, so one run shows every failure.
# Actions are pinned by commit, with the release in a comment; Dependabot
# proposes updates to them.

jobs:
  linux:
    name: Checks under PowerShell 7 on Linux
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: PSScriptAnalyzer
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Invoke-RepositoryCheck.ps1 -Check Analyzer -InstallModule -Strict

      - name: Windows PowerShell 5.1 compatibility
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Invoke-RepositoryCheck.ps1 -Check Compatibility -InstallModule -Strict

      - name: Scan for tenant identifiers and secrets
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Invoke-RepositoryCheck.ps1 -Check Scan

      - name: Folder READMEs
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Invoke-RepositoryCheck.ps1 -Check Readme

      - name: Pester under PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./Tools/Invoke-RepositoryCheck.ps1 -Check Pester -InstallModule -Strict -PesterOutput Detailed

  windows:
    name: Checks on Windows, under Windows PowerShell 5.1 and PowerShell 7
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Windows PowerShell is the only host on a managed device, so anything that
      # declares 5.1 must parse, and pass its tests, under it.
      - name: Parse under Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\Tools\Invoke-RepositoryCheck.ps1 -Check Parse

      - name: Pester under Windows PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: .\Tools\Invoke-RepositoryCheck.ps1 -Check Pester -InstallModule -Strict -PesterOutput Detailed

      # Tests of Windows-only scripts are skipped on Linux, so this is the only
      # run of them under PowerShell 7, which is how most people run them.
      - name: Pester under PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: .\Tools\Invoke-RepositoryCheck.ps1 -Check Pester -InstallModule -Strict -PesterOutput Detailed
